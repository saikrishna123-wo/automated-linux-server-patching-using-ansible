
---
- name: Generate Linux Patching Reports
  hosts: linux_servers
  become: yes
  gather_facts: yes

  tasks:
    - name: Collect uptime
      command: uptime
      register: uptime_info
      changed_when: false

    - name: Collect disk usage
      command: df -h /
      register: disk_info
      changed_when: false

    - name: Collect memory information
      command: free -h
      register: memory_info
      changed_when: false

    - name: Check SSH service
      command: systemctl is-active ssh
      register: ssh_info
      changed_when: false

    - name: Check reboot requirement
      stat:
        path: /var/run/reboot-required
      register: reboot_info

    - name: Check remaining package updates
      shell: apt list --upgradable 2>/dev/null
      register: updates_info
      changed_when: false

    - name: Create reports directory on Master
      file:
        path: "{{ playbook_dir }}/../reports"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false

    - name: Save report on Ansible Master
      copy:
        dest: "{{ playbook_dir }}/../reports/{{ inventory_hostname }}-patch-report.txt"
        content: |
          AUTOMATED LINUX SERVER PATCHING REPORT
          ======================================

          Server: {{ inventory_hostname }}
          Hostname: {{ ansible_hostname }}
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          Kernel: {{ ansible_kernel }}
          Date: {{ ansible_date_time.iso8601 }}

          UPTIME:
          {{ uptime_info.stdout }}

          DISK USAGE:
          {{ disk_info.stdout }}

          MEMORY:
          {{ memory_info.stdout }}

          SSH SERVICE:
          {{ ssh_info.stdout }}

          REBOOT REQUIRED:
          {{ reboot_info.stat.exists }}

          REMAINING UPDATES:
          {{ updates_info.stdout }}
        mode: '0644'
      delegate_to: localhost
      become: false

